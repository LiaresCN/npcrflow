[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npcrflow"
version = "0.4.0"
description = "Leakage-aware, native-resolution nested proxy climate reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LiaresCN"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.scripts]
npcrflow = "npcrflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
